name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            codevibes-backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install backend deps
        run: npm ci --prefix codevibes-backend
      - name: Lint
        run: |
          npm run lint
          npm --prefix codevibes-backend run lint
      - name: Typecheck
        run: npm run typecheck
      - name: File size / absolute-path check
        run: node scripts/check-file-size.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            codevibes-backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install backend deps
        run: npm ci --prefix codevibes-backend
      - name: Test (frontend)
        run: npx vitest run --coverage
      - name: Test (backend)
        run: npm --prefix codevibes-backend run test -- --coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            codevibes-backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install backend deps
        run: npm ci --prefix codevibes-backend
      - name: Build frontend
        run: npm run build
      - name: Build backend
        run: npm --prefix codevibes-backend run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect (pinned v8.30.1)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --exit-code 1
      - name: Install semgrep (pinned v1.173.0)
        run: pipx install "semgrep==1.173.0"
      - name: semgrep ci
        env:
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: semgrep ci --config p/typescript --config p/javascript --severity ERROR

