name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            codevibes-backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install backend deps
        run: npm ci --prefix codevibes-backend
      # Canonical command contract (lint:all + typecheck + tests + builds +
      # doc-link + guidance + grandfathered structural/complexity budgets + bundle-size). CI is the
      # enforcement point; pre-commit/pre-push stay cheap.
      - name: Full check (canonical)
        run: npm run ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks detect (pinned v8.30.1, checksum-verified)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt" -o gitleaks_checksums.txt
          grep "gitleaks_8.30.1_linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks detect --source . --exit-code 1
      # Preserve the existing security scan while the separate plan to vendor or
      # pin its rule set is completed. Do not remove a current gate as part of
      # harness standardization.
      - name: Install semgrep (pinned v1.173.0)
        run: pipx install "semgrep==1.173.0"
      - name: semgrep scan
        run: semgrep scan --config p/typescript --config p/javascript --error
